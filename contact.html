<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Smart Mall</title>
  <meta name="description" content="Get in touch with the Smart Mall team.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/content.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main">

    <section class="page-hero"><div class="container">
      <span class="eyebrow">Contact</span><h1>We'd love to hear from you.</h1>
      <p class="lead">Questions, feedback, or partnership ideas — reach out any time.</p>
    </div></section>
    <section class="section"><div class="container contact-grid">
      <form class="card" style="padding:2rem" onsubmit="return Home.subscribe(event)">
        <div class="field"><label for="cn">Name</label><input class="input" id="cn" required></div>
        <div class="field"><label for="ce">Email</label><input class="input" id="ce" type="email" required></div>
        <div class="field"><label for="cm">Message</label><textarea class="input" id="cm" rows="5" required></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
      </form>
      <div class="contact-info">
        <div class="card" style="padding:1.4rem;margin-bottom:1rem"><h3>📍 Visit</h3><p style="color:var(--text-muted)">Smart Mall HQ, Lagos, Nigeria</p></div>
        <div class="card" style="padding:1.4rem;margin-bottom:1rem"><h3>✉️ Email</h3><p style="color:var(--text-muted)">support@smartmall.example</p></div>
        <div class="card" style="padding:1.4rem"><h3>🕑 Hours</h3><p style="color:var(--text-muted)">Mon–Sat, 8am–8pm WAT</p></div>
      </div>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>

</body>
</html>
