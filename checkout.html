<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Smart Mall</title>
  <meta name="description" content="Complete your order at Smart Mall.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/content.css">
  <link rel="stylesheet" href="assets/css/cart.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main">

    <section class="section"><div class="container">
      <span class="eyebrow">Checkout · Step 2 of 3</span><h1 style="margin:.5rem 0 2rem">Delivery & payment</h1>
      <div class="cart-layout">
        <form class="card" style="padding:1.8rem" onsubmit="return false">
          <h3 style="margin-bottom:1rem">Delivery address</h3>
          <div class="field"><label for="fn">Full name</label><input class="input" id="fn" required></div>
          <div class="field"><label for="ph">Phone</label><input class="input" id="ph" type="tel" required></div>
          <div class="field"><label for="ad">Address</label><input class="input" id="ad" required></div>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:1rem">
            <div class="field"><label for="ct">City</label><input class="input" id="ct" required></div>
            <div class="field"><label for="st">State</label><input class="input" id="st" required></div>
          </div>
          <h3 style="margin:1.2rem 0 1rem">Payment</h3>
          <label class="check" style="padding:.8rem 1rem;border:1px solid var(--primary);border-radius:12px;background:var(--surface-2)">
            <input type="radio" name="pay" checked> Pay with Paystack (card / transfer)</label>
          <p class="hint" style="margin-top:.6rem">Secure payment via Paystack. Card details are never stored by Smart Mall.</p>
        </form>
        <aside class="cart-summary card" id="coSummary"></aside>
      </div>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{
  const fmt=n=>"₦"+n.toLocaleString("en-NG");const SHIP=2500;
  const cart=JSON.parse(localStorage.getItem("mall-cart")||"[]");const g={};cart.forEach(i=>g[i]=(g[i]||0)+1);
  const sub=Object.keys(g).reduce((s,id)=>{const p=MallData.products.find(x=>x.id===id);return s+(p?p.price*g[id]:0);},0);
  const total=sub+(cart.length?SHIP:0);
  document.getElementById("coSummary").innerHTML=`<h3>Order summary</h3>
    <div class="sum-row"><span>Items (${cart.length})</span><span>${fmt(sub)}</span></div>
    <div class="sum-row"><span>Shipping</span><span>${fmt(cart.length?SHIP:0)}</span></div>
    <div class="sum-row total"><span>Total</span><span>${fmt(total)}</span></div>
    <button class="btn btn-primary btn-block" style="margin-top:1rem" onclick="alert('Paystack checkout opens once the backend is connected.')">Pay ${fmt(total)}</button>`;
});</script>
</body>
</html>
