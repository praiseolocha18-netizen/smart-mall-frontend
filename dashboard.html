<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Smart Mall</title>
  <meta name="description" content="Your Smart Mall dashboard.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/content.css">
  <link rel="stylesheet" href="assets/css/cart.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main">

    <section class="section"><div class="container">
      <span class="eyebrow">Your account</span><h1 style="margin:.5rem 0 .3rem" id="greet">Welcome back</h1>
      <p class="lead" style="margin-bottom:2rem">Here's what's happening with your account.</p>
      <div class="grid dash-cards">
        <div class="card dash-card"><small>Orders</small><b>12</b><span class="up">+2 this month</span></div>
        <div class="card dash-card"><small>Reward points</small><b>1,840</b><span class="up">Gold tier</span></div>
        <div class="card dash-card"><small>Wishlist</small><b id="wishCount">0</b><span>saved items</span></div>
        <div class="card dash-card"><small>Recently viewed</small><b id="recentCount">0</b><span>products</span></div>
      </div>
      <div class="dash-grid">
        <section class="card" style="padding:1.6rem">
          <h3 style="margin-bottom:1rem">Recommended for you</h3>
          <div class="grid product-grid" id="dashRecs" style="grid-template-columns:repeat(2,1fr)"></div>
        </section>
        <aside class="card" style="padding:1.6rem">
          <h3 style="margin-bottom:1rem">Quick links</h3>
          <ul class="dash-links">
            <li><a href="cart.html">🛒 View cart</a></li>
            <li><a href="wishlist.html">♡ Wishlist</a></li>
            <li><a href="products.html">🔍 Keep shopping</a></li>
            <li><a href="#" onclick="Auth.logout();return false">↪ Sign out</a></li>
          </ul>
        </aside>
      </div>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>
<script src="assets/js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded",async ()=>{ if(window.MallData&&MallData.load){try{await MallData.load();}catch(e){}}
  const s=Auth.current();if(s&&s.user&&s.user.name)document.getElementById("greet").textContent=`Welcome back, ${s.user.name.split(" ")[0]}`;
  const fmt=n=>"₦"+n.toLocaleString("en-NG");
  document.getElementById("wishCount").textContent=(JSON.parse(localStorage.getItem("mall-wishlist")||"[]")).length;
  document.getElementById("recentCount").textContent=(JSON.parse(localStorage.getItem("mall-recent")||"[]")).length;
  const card=(p)=>{ // p is UI-shaped OR backend-shaped; handle both
    const id=p.slug||p.id||p._id;
    const catName=(p.category&&p.category.name)||(MallData.categories.find(x=>x.id===p.cat)||{}).name||"";
    const bg=p.bg||(MallData.bgFor?MallData.bgFor(id):"linear-gradient(135deg,#2563EB,#14B8A6)");
    return `<article class="card p-card"><a class="p-media" href="product.html?id=${id}"><div class="ph" style="background:${bg}"></div></a>
    <div class="p-body"><span class="p-cat">${catName}</span><a class="p-name" href="product.html?id=${id}">${p.name}</a>
    <div class="p-foot"><span class="p-price">${fmt(p.price)}</span></div></div></article>`;
  };
  let recs=MallData.products.slice(0,4); // fallback
  if(window.MallAPI&&MallAPI.enabled()&&Auth.current()){
    try{ const r=await MallAPI.recForYou(4); const list=(r.data&&r.data.products)||[]; if(list.length) recs=list; }catch(e){}
  }
  document.getElementById("dashRecs").innerHTML=recs.map(card).join("");
});</script>
</body>
</html>
