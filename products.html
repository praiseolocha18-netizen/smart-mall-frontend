<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Smart Mall</title>
  <meta name="description" content="Browse all products at Smart Mall. Filter by category, brand, price, and rating.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>

  <main id="main" class="container section">
    <div class="shop-head">
      <div>
        <span class="eyebrow">Directory</span>
        <h1 id="shopTitle">All products</h1>
        <p class="lead" id="shopCount">Loading…</p>
      </div>
      <div class="shop-search">
        <input class="input" id="searchBox" type="search" placeholder="Search products…" aria-label="Search products">
      </div>
    </div>

    <div class="shop-layout">
      <!-- Filters -->
      <aside class="filters card" aria-label="Filters">
        <button class="filter-close icon-btn" id="filterClose" aria-label="Close filters">✕</button>
        <h3>Filters</h3>
        <div class="filter-group">
          <h4>Category</h4>
          <div id="catFilters"></div>
        </div>
        <div class="filter-group">
          <h4>Max price</h4>
          <input type="range" id="priceRange" min="10000" max="100000" step="1000" value="100000" style="width:100%">
          <div class="price-label"><span>₦10k</span><span id="priceOut">₦100k</span></div>
        </div>
        <div class="filter-group">
          <h4>Minimum rating</h4>
          <div class="rating-filter" id="ratingFilters">
            <button data-rating="0" class="chip active">Any</button>
            <button data-rating="4">4★+</button>
            <button data-rating="4.5">4.5★+</button>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="resetFilters">Reset filters</button>
      </aside>

      <!-- Results -->
      <section class="results">
        <div class="results-bar">
          <button class="btn btn-ghost" id="filterToggle">Filters</button>
          <label class="sort">Sort
            <select class="input" id="sortSelect">
              <option value="pop">Popularity</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Rating</option>
              <option value="new">Newest</option>
            </select>
          </label>
        </div>
        <div class="grid product-grid" id="results" aria-live="polite"></div>
        <p id="noResults" class="center lead" hidden>No products match your filters. Try widening them.</p>
      </section>
    </div>
  </main>

  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
