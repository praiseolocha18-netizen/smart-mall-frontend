<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart — Smart Mall</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main" class="container section">
    <span class="eyebrow">Checkout · Step 1 of 3</span>
    <h1 style="margin:.5rem 0 2rem">Your cart</h1>
    <div class="cart-layout" id="cartLayout">
      <div class="cart-items" id="cartItems"></div>
      <aside class="cart-summary card" id="cartSummary"></aside>
    </div>
    <div id="cartEmpty" class="center" hidden style="padding:4rem 0">
      <div style="font-size:3rem">🛍️</div>
      <h2>Your cart is empty</h2>
      <p class="lead">Browse the mall and add something you love.</p>
      <a class="btn btn-primary" href="products.html" style="margin-top:1rem">Start shopping</a>
    </div>
  </main>
  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
