<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Smart Mall</title>
  <meta name="description" content="Reset your Smart Mall password.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/content.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main">

    <section class="section"><div class="container" style="max-width:440px">
      <div class="card" style="padding:2rem">
        <span class="eyebrow">Account</span><h1 style="margin:.5rem 0 .4rem;font-size:1.6rem">Reset your password</h1>
        <p class="lead" style="font-size:1rem;margin-bottom:1.5rem">Enter your email and we'll send a secure reset link.</p>
        <form onsubmit="return Home.subscribe(event)">
          <div class="field"><label for="fe">Email</label><input class="input" id="fe" type="email" required placeholder="you@example.com"></div>
          <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        </form>
        <p class="center" style="margin-top:1.2rem;font-size:.9rem"><a href="login.html" style="color:var(--primary);font-weight:600">Back to sign in</a></p>
      </div>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/home.js"></script>

</body>
</html>
